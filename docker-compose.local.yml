services:
  postgres:
    image: postgres:17-alpine
    container_name: eksportir-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eksportir
      POSTGRES_PASSWORD: eksportir_secret
      POSTGRES_DB: eksportir
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eksportir -d eksportir"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
