# ── UMKM ONLINE ──────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.tokotimika.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.tokotimika.my.id;

    ssl_certificate     /etc/letsencrypt/live/api.tokotimika.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tokotimika.my.id/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    location /api {
        set $upstream_umkm http://umkm-api:4000;
        proxy_pass $upstream_umkm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
