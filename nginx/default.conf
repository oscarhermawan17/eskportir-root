# ── UMKM ONLINE ──────────────────────────────────────────────────────────────
# BE-only: FE ada di Vercel (tokotimika.my.id)
# FE memanggil API ke https://api.tokotimika.my.id/api/...
server {
    listen 80;
    server_name api.tokotimika.my.id;

    resolver 127.0.0.11 valid=10s;

    location /api {
        set $upstream_umkm http://umkm-api:4000;
        proxy_pass $upstream_umkm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name projectbali.my.id;

    resolver 127.0.0.11 valid=10s;

    location /api {
        set $upstream_api http://api:3001;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        set $upstream_fe http://web:3000;
        proxy_pass $upstream_fe;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name ui.projectbali.my.id;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream_sb http://storybook:80;
        proxy_pass $upstream_sb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
