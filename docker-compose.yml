services:
  postgres:
    image: postgres:17-alpine
    container_name: eksportir-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eksportir
      POSTGRES_PASSWORD: eksportir_secret
      POSTGRES_DB: eksportir
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eksportir -d eksportir"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eksportir-net

  api:
    image: ghcr.io/oscarhermawan17/eksportir-api:latest
    build:
      context: ./eksportir-api
    container_name: eksportir-api
    restart: unless-stopped
    env_file: ./eksportir-api/.env
    environment:
      DATABASE_URL: postgresql://eksportir:eksportir_secret@postgres:5432/eksportir
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eksportir-net

  nginx:
    image: nginx:alpine
    container_name: eksportir-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - umkm-api
    networks:
      - eksportir-net

  # ── UMKM ONLINE ──────────────────────────────────────────────────────────────
  umkm-api:
    image: ghcr.io/oscarhermawan17/online-shop-api:latest
    container_name: umkm-api
    restart: unless-stopped
    env_file: ./umkm.env
    expose:
      - "4000"
    networks:
      - eksportir-net
  # ─────────────────────────────────────────────────────────────────────────────

networks:
  eksportir-net:
    driver: bridge

volumes:
  postgres_data:
